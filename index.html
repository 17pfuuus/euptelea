<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euptelea - 专注与记账</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* 全局字体：中文华文中宋，数字与英文 Georgia */
        body { 
            font-family: "华文中宋", Georgia, serif; 
        }
        span, div, button, textarea, h1, h2, h3, input, select {
            font-family: "华文中宋", Georgia, serif;
        }
        /* 数字、时间、价格强制使用 Georgia 字体 */
        .font-num, .font-mono, input[type=number] {
            font-family: Georgia, serif !important;
        }
        /* 去除数字输入框上下加减箭头 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                play: <path d="M5 3l14 9-14 9V3z"/>,
                pause: <path d="M6 4h4v16H6zM14 4h4v16h-4z"/>,
                square: <rect x="4" y="4" width="16" height="16" rx="2"/>,
                calendar: <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM5 8V6h14v2H5z"/>,
                settings: <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>,
                trash: <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>,
                plus: <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>,
                download: <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>,
                upload: <path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/>,
                x: <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>,
                chevronLeft: <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>,
                chevronRight: <path d="M10.06 15.06l5.94-5.94-5.94-5.94L11.47 1.76l7.35 7.35-7.35 7.35z"/>,
                book: <path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/>,
                clock: <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>,
                wallet: <path d="M21 7.28V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-2.28c.6-.35 1-.99 1-1.72V9c0-.73-.4-1.37-1-1.72zM20 19H5V5h14v2.12c-.63.36-1 1.03-1 1.78v6.2c0 .75.37 1.42 1 1.78V19zM16 13.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>,
                image: <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>,
                star: <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const THEMES = [
            { id: '#9F3025', hex: '#9F3025' },
            { id: '#F39D00', hex: '#F39D00' },
            { id: '#789658', hex: '#789658' },
            { id: '#294B85', hex: '#294B85' },
            { id: '#E6B6AA', hex: '#E6B6AA' },
            { id: '#D7D9D8', hex: '#D7D9D8' },
        ];

        const PRESET_CATEGORIES = {
            expense: ['餐饮', '交通', '购物', '居住', '娱乐', '医疗', '学习', '其他'],
            income: ['工资', '奖金', '理财', '兼职', '其他']
        };

        const hexToRgba = (hex, alpha) => {
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            return `rgba(${num >> 16}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
        };

        function App() {
            const [currentTab, setCurrentTab] = useState('focus');
            const [showSettings, setShowSettings] = useState(false);
            const [theme, setTheme] = useState(() => localStorage.getItem('euptelea_theme') || '#789658');
            
            const [username, setUsername] = useState(() => localStorage.getItem('euptelea_username') || 'Euptelea');
            const [isEditingUsername, setIsEditingUsername] = useState(false);

            const [timerState, setTimerState] = useState('idle');
            const [startTime, setStartTime] = useState(null);
            const [accumulatedSeconds, setAccumulatedSeconds] = useState(0);
            const [elapsedSeconds, setElapsedSeconds] = useState(0);
            const [timerBgImage, setTimerBgImage] = useState(() => localStorage.getItem('euptelea_bg_img') || '');
            
            const [sessions, setSessions] = useState(() => JSON.parse(localStorage.getItem('euptelea_sessions') || '[]'));
            const [diaries, setDiaries] = useState(() => JSON.parse(localStorage.getItem('euptelea_diaries') || '{}'));
            const [memo, setMemo] = useState(() => localStorage.getItem('euptelea_memo') || '');
            const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('euptelea_transactions') || '[]'));

            const [showTxModal, setShowTxModal] = useState(false);
            const [editingTx, setEditingTx] = useState(null);

            const [selectedDate, setSelectedDate] = useState(null);
            const [currentMonth, setCurrentMonth] = useState(new Date());
            const [txMonth, setTxMonth] = useState(new Date());

            useEffect(() => { localStorage.setItem('euptelea_theme', theme); }, [theme]);
            useEffect(() => { localStorage.setItem('euptelea_username', username); }, [username]);
            useEffect(() => { localStorage.setItem('euptelea_sessions', JSON.stringify(sessions)); }, [sessions]);
            useEffect(() => { localStorage.setItem('euptelea_diaries', JSON.stringify(diaries)); }, [diaries]);
            useEffect(() => { localStorage.setItem('euptelea_memo', memo); }, [memo]);
            useEffect(() => { localStorage.setItem('euptelea_transactions', JSON.stringify(transactions)); }, [transactions]);
            useEffect(() => { 
                if(timerBgImage) localStorage.setItem('euptelea_bg_img', timerBgImage);
                else localStorage.removeItem('euptelea_bg_img');
            }, [timerBgImage]);

            useEffect(() => {
                let interval = null;
                if (timerState === 'running') {
                    interval = setInterval(() => {
                        const now = Date.now();
                        const currentRunningSec = Math.floor((now - startTime) / 1000);
                        setElapsedSeconds(accumulatedSeconds + currentRunningSec);
                    }, 100);
                }
                return () => clearInterval(interval);
            }, [timerState, startTime, accumulatedSeconds]);

            const startTimer = () => {
                setStartTime(Date.now());
                setAccumulatedSeconds(0);
                setElapsedSeconds(0);
                setTimerState('running');
            };

            const pauseTimer = () => {
                const now = Date.now();
                const currentRunningSec = Math.floor((now - startTime) / 1000);
                const total = accumulatedSeconds + currentRunningSec;
                setAccumulatedSeconds(total);
                setElapsedSeconds(total);
                setTimerState('paused');
            };

            const resumeTimer = () => {
                setStartTime(Date.now());
                setTimerState('running');
            };

            const endTimer = () => {
                if (elapsedSeconds > 0) {
                    const nowIso = new Date().toISOString().split('T')[0];
                    const newSession = {
                        id: 's_' + Date.now(),
                        startTime: new Date(Date.now() - elapsedSeconds * 1000).toISOString(),
                        endTime: new Date().toISOString(),
                        durationSeconds: elapsedSeconds,
                        date: nowIso,
                        createdAt: new Date().toISOString()
                    };
                    setSessions(prev => [newSession, ...prev]);
                }
                setTimerState('idle');
                setElapsedSeconds(0);
                setAccumulatedSeconds(0);
                setStartTime(null);
            };

            const formatTime = (totalSeconds) => {
                const h = Math.floor(totalSeconds / 3600);
                const m = Math.floor((totalSeconds % 3600) / 60);
                const s = totalSeconds % 60;
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            };

            const todayStr = new Date().toISOString().split('T')[0];
            const todaySessions = sessions.filter(s => s.date === todayStr);
            const todayTotalSeconds = todaySessions.reduce((acc, s) => acc + s.durationSeconds, 0);

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (uploadEvent) => { setTimerBgImage(uploadEvent.target.result); };
                    reader.readAsDataURL(file);
                }
            };

            const handleUsernameChange = (e) => {
                const val = e.target.value.replace(/[^a-zA-Z\s]/g, '');
                setUsername(val);
            };

            const exportData = () => {
                const data = { username, sessions, diaries, memo, transactions, theme, version: '1.5' };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `euptelea_backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
            };

            // 导入数据功能实现
            const importData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (uploadEvent) => {
                    try {
                        const json = JSON.parse(uploadEvent.target.result);
                        if (window.confirm('导入数据将合并或覆盖当前本地数据，确定要导入吗？')) {
                            if (json.username) { setUsername(json.username); localStorage.setItem('euptelea_username', json.username); }
                            if (json.sessions) { setSessions(json.sessions); localStorage.setItem('euptelea_sessions', JSON.stringify(json.sessions)); }
                            if (json.diaries) { setDiaries(json.diaries); localStorage.setItem('euptelea_diaries', JSON.stringify(json.diaries)); }
                            if (json.memo) { setMemo(json.memo); localStorage.setItem('euptelea_memo', json.memo); }
                            if (json.transactions) { setTransactions(json.transactions); localStorage.setItem('euptelea_transactions', JSON.stringify(json.transactions)); }
                            if (json.theme) { setTheme(json.theme); localStorage.setItem('euptelea_theme', json.theme); }
                            alert('数据导入成功！');
                        }
                    } catch (err) {
                        alert('文件格式错误，解析 JSON 失败！');
                    }
                };
                reader.readAsText(file);
            };

            const clearAllData = () => {
                if (window.confirm('确定要清空全部数据（含专注、日记、便签、账目）吗？此操作不可恢复！')) {
                    setSessions([]);
                    setDiaries({});
                    setMemo('');
                    setTransactions([]);
                    setUsername('Euptelea');
                    localStorage.clear();
                    alert('数据已清空');
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col relative pb-20">
                    <header className="px-6 py-4 flex justify-between items-center border-b border-gray-100">
                        {isEditingUsername ? (
                            <input 
                                type="text"
                                value={username}
                                onChange={handleUsernameChange}
                                onBlur={() => setIsEditingUsername(false)}
                                onKeyDown={(e) => { if(e.key === 'Enter') setIsEditingUsername(false); }}
                                autoFocus
                                className="text-xl font-bold border-b border-gray-300 focus:outline-none bg-transparent max-w-[200px]"
                                style={{ color: theme }}
                            />
                        ) : (
                            <h1 
                                onClick={() => setIsEditingUsername(true)}
                                title="点击修改昵称（仅英文）"
                                className="text-xl font-bold tracking-wider cursor-pointer hover:opacity-80 transition" 
                                style={{ color: theme }}
                            >
                                {username || 'Euptelea'}
                            </h1>
                        )}
                        <button 
                            onClick={() => {
                                if (showSettings) {
                                    setShowSettings(false);
                                    setCurrentTab('focus');
                                } else {
                                    setShowSettings(true);
                                    setCurrentTab('settings');
                                }
                            }} 
                            className="p-2 text-gray-500 hover:text-black transition"
                        >
                            <Icon name="settings" size={22} />
                        </button>
                    </header>

                    <main className="flex-1 overflow-y-auto p-6">
                        {showSettings ? (
                            <div className="space-y-6">
                                <h2 className="text-lg font-bold">主题色选择</h2>
                                <div className="flex space-x-4 items-center justify-start py-2">
                                    {THEMES.map(t => (
                                        <button 
                                            key={t.id} 
                                            onClick={() => setTheme(t.id)}
                                            className={`w-7 h-7 rounded-full shadow-sm flex items-center justify-center transition-all ${theme === t.id ? 'ring-2 ring-offset-2 ring-black scale-110' : 'hover:scale-105 opacity-80 hover:opacity-100'}`}
                                            style={{ backgroundColor: t.hex }}
                                        ></button>
                                    ))}
                                </div>

                                <h2 className="text-lg font-bold pt-4">用户设置</h2>
                                <div className="space-y-2">
                                    <label className="text-xs text-gray-500">修改用户昵称（仅限英文）：</label>
                                    <input 
                                        type="text"
                                        value={username}
                                        onChange={handleUsernameChange}
                                        className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-1 focus:ring-gray-300 font-num"
                                        placeholder="Euptelea"
                                    />
                                </div>

                                <h2 className="text-lg font-bold pt-4">数据管理</h2>
                                <div className="space-y-3">
                                    <button onClick={exportData} className="w-full py-3 bg-gray-100 hover:bg-gray-200 rounded-xl font-medium text-sm flex items-center justify-center space-x-2 transition">
                                        <Icon name="download" size={18} />
                                        <span>导出全部数据 (JSON)</span>
                                    </button>
                                    <label className="w-full py-3 bg-gray-100 hover:bg-gray-200 rounded-xl font-medium text-sm flex items-center justify-center space-x-2 transition cursor-pointer">
                                        <Icon name="upload" size={18} />
                                        <span>导入数据恢复 (JSON)</span>
                                        <input type="file" accept=".json" onChange={importData} className="hidden" />
                                    </label>
                                    <button onClick={clearAllData} className="w-full py-3 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl font-medium text-sm flex items-center justify-center space-x-2 transition">
                                        <Icon name="trash" size={18} />
                                        <span>清空全部数据</span>
                                    </button>
                                </div>
                            </div>
                        ) : currentTab === 'focus' ? (
                            <div className="space-y-6">
                                <div 
                                    className="w-full aspect-square rounded-3xl shadow-lg relative flex flex-col justify-between p-6 text-white overflow-hidden transition-all"
                                    style={{
                                        backgroundColor: timerBgImage ? 'transparent' : theme,
                                        backgroundImage: timerBgImage ? `url(${timerBgImage})` : 'none',
                                        backgroundSize: 'cover',
                                        backgroundPosition: 'center'
                                    }}
                                >
                                    {timerBgImage && <div className="absolute inset-0 bg-black/15 backdrop-blur-[0.5px]"></div>}

                                    <div className="relative z-10 flex justify-between items-center">
                                        <div className="flex items-center space-x-2 bg-black/25 px-3 py-1 rounded-full text-xs backdrop-blur-md">
                                            <span className="w-2 h-2 rounded-full bg-white"></span>
                                            <span>{timerState === 'running' ? '专注中' : timerState === 'paused' ? '已暂停' : '准备就绪'}</span>
                                        </div>
                                        <label className="cursor-pointer bg-black/25 p-2 rounded-full hover:bg-black/40 backdrop-blur-md transition">
                                            <Icon name="image" size={16} />
                                            <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                                        </label>
                                    </div>

                                    <div className={`relative z-10 text-center my-auto transition-opacity ${timerState === 'idle' ? 'opacity-40' : 'opacity-100'}`}>
                                        <div className="text-5xl font-mono font-bold tracking-tight drop-shadow-md font-num">
                                            {formatTime(elapsedSeconds)}
                                        </div>
                                        <div className="text-xs opacity-90 mt-2 font-num">今日累计 {Math.floor(todayTotalSeconds / 60)} 分钟</div>
                                    </div>

                                    <div className="relative z-10 flex space-x-3">
                                        {timerState === 'idle' && (
                                            <button 
                                                onClick={startTimer}
                                                className="w-full py-4 rounded-2xl font-bold shadow-lg transition active:scale-95 bg-white/30 backdrop-blur-md text-white hover:bg-white/40"
                                            >
                                                开始专注
                                            </button>
                                        )}
                                        {timerState === 'running' && (
                                            <>
                                                <button onClick={pauseTimer} className="flex-1 py-3 rounded-2xl bg-white/30 backdrop-blur-md font-semibold text-white hover:bg-white/40 transition">
                                                    暂停
                                                </button>
                                                <button onClick={endTimer} className="flex-1 py-3 rounded-2xl bg-white/30 backdrop-blur-md font-semibold text-white hover:bg-white/40 transition">
                                                    结束记录
                                                </button>
                                            </>
                                        )}
                                        {timerState === 'paused' && (
                                            <>
                                                <button onClick={resumeTimer} className="flex-1 py-3 rounded-2xl bg-white/30 backdrop-blur-md font-semibold text-white hover:bg-white/40 transition">
                                                    继续
                                                </button>
                                                <button onClick={endTimer} className="flex-1 py-3 rounded-2xl bg-white/30 backdrop-blur-md font-semibold text-white hover:bg-white/40 transition">
                                                    结束记录
                                                </button>
                                            </>
                                        )}
                                    </div>
                                </div>

                                {/* 便签备忘录：去掉了 title，占位符改为“今日事，今日毕。”，字体放大50% */}
                                <div 
                                    className="border-2 rounded-2xl p-4 shadow-sm bg-transparent transition-all"
                                    style={{ borderColor: hexToRgba(theme, 0.45) }}
                                >
                                    <textarea 
                                        value={memo} 
                                        onChange={(e) => setMemo(e.target.value)}
                                        placeholder="今日事，今日毕。"
                                        rows="4"
                                        className="w-full bg-transparent text-base resize-none focus:outline-none placeholder-gray-400 font-medium font-num"
                                        style={{ color: theme, fontSize: '1.125rem', lineHeight: '1.75rem' }}
                                    ></textarea>
                                </div>
                            </div>
                        ) : currentTab === 'transactions' ? (
                            <TransactionsView 
                                transactions={transactions} 
                                theme={theme} 
                                currentMonth={txMonth} 
                                setCurrentMonth={setTxMonth} 
                                onOpenAdd={() => { setEditingTx(null); setShowTxModal(true); }}
                                onEditTx={(tx) => { setEditingTx(tx); setShowTxModal(true); }}
                            />
                        ) : currentTab === 'calendar' && (
                            <CalendarView 
                                sessions={sessions} 
                                diaries={diaries} 
                                theme={theme} 
                                currentMonth={currentMonth} 
                                setCurrentMonth={setCurrentMonth} 
                                onSelectDate={(date) => setSelectedDate(date)} 
                            />
                        )}
                    </main>

                    <nav className="absolute bottom-0 left-0 right-0 h-16 bg-white border-t border-gray-100 flex justify-around items-center px-4">
                        <button 
                            onClick={() => { setShowSettings(false); setCurrentTab('focus'); }} 
                            className={`flex flex-col items-center space-y-1 ${!showSettings && currentTab === 'focus' ? '' : 'text-gray-400'}`} 
                            style={{ color: !showSettings && currentTab === 'focus' ? theme : undefined }}
                        >
                            <Icon name="clock" size={20} />
                            <span className="text-xs font-medium">专注</span>
                        </button>
                        <button 
                            onClick={() => { setShowSettings(false); setCurrentTab('transactions'); }} 
                            className={`flex flex-col items-center space-y-1 ${!showSettings && currentTab === 'transactions' ? '' : 'text-gray-400'}`} 
                            style={{ color: !showSettings && currentTab === 'transactions' ? theme : undefined }}
                        >
                            <Icon name="wallet" size={20} />
                            <span className="text-xs font-medium">记账</span>
                        </button>
                        <button 
                            onClick={() => { setShowSettings(false); setCurrentTab('calendar'); }} 
                            className={`flex flex-col items-center space-y-1 ${!showSettings && currentTab === 'calendar' ? '' : 'text-gray-400'}`} 
                            style={{ color: !showSettings && currentTab === 'calendar' ? theme : undefined }}
                        >
                            <Icon name="calendar" size={20} />
                            <span className="text-xs font-medium">日历</span>
                        </button>
                    </nav>

                    {showTxModal && (
                        <TransactionModal 
                            editingTx={editingTx} 
                            theme={theme}
                            onClose={() => setShowTxModal(false)}
                            onSave={(txData) => {
                                if (editingTx) {
                                    setTransactions(prev => prev.map(t => t.id === editingTx.id ? { ...t, ...txData, updatedAt: new Date().toISOString() } : t));
                                } else {
                                    const newTx = {
                                        id: 'tx_' + Date.now(),
                                        ...txData,
                                        createdAt: new Date().toISOString()
                                    };
                                    setTransactions(prev => [newTx, ...prev]);
                                }
                                setShowTxModal(false);
                            }}
                            onDelete={(id) => {
                                if (window.confirm('确定要删除这笔账目吗？')) {
                                    setTransactions(prev => prev.filter(t => t.id !== id));
                                    setShowTxModal(false);
                                }
                            }}
                        />
                    )}

                    {selectedDate && (
                        <DateDetailModal 
                            date={selectedDate} 
                            sessions={sessions.filter(s => s.date === selectedDate)}
                            transactions={transactions.filter(t => t.date === selectedDate)}
                            diary={diaries[selectedDate] || ''}
                            onClose={() => setSelectedDate(null)}
                            onSaveDiary={(content) => {
                                setDiaries(prev => ({ ...prev, [selectedDate]: content }));
                            }}
                            onGoToTransactions={() => {
                                setSelectedDate(null);
                                setTxMonth(new Date(selectedDate));
                                setCurrentTab('transactions');
                            }}
                            theme={theme}
                        />
                    )}
                </div>
            );
        }

        function TransactionsView({ transactions, theme, currentMonth, setCurrentMonth, onOpenAdd, onEditTx }) {
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            const monthStr = `${year}-${String(month + 1).padStart(2, '0')}`;
            
            const monthTxs = useMemo(() => {
                return transactions.filter(t => t.date.startsWith(monthStr));
            }, [transactions, monthStr]);

            const activeCategoryExpenses = useMemo(() => {
                const map = {};
                PRESET_CATEGORIES.expense.forEach(cat => { map[cat] = 0; });
                monthTxs.filter(t => t.type === 'expense').forEach(t => {
                    map[t.category] = (map[t.category] || 0) + t.amountCents;
                });
                return Object.entries(map).filter(([cat, amount]) => amount > 0);
            }, [monthTxs]);

            const maxExpense = Math.max(...activeCategoryExpenses.map(([cat, amount]) => amount), 100);

            const formatYuan = (cents) => (cents / 100).toFixed(2);

            const groupedTxs = useMemo(() => {
                const groups = {};
                monthTxs.forEach(t => {
                    if (!groups[t.date]) groups[t.date] = [];
                    groups[t.date].push(t);
                });
                return Object.keys(groups).sort().reverse().map(date => ({
                    date,
                    items: groups[date],
                    dayExpense: groups[date].filter(t => t.type === 'expense').reduce((s, t) => s + t.amountCents, 0),
                    dayIncome: groups[date].filter(t => t.type === 'income').reduce((s, t) => s + t.amountCents, 0)
                }));
            }, [monthTxs]);

            return (
                <div className="space-y-6">
                    <div className="bg-gray-900 text-white rounded-3xl p-5 shadow-lg space-y-3">
                        <div className="flex justify-between items-center text-xs opacity-80 border-b border-gray-800 pb-2">
                            <span>{year}年{month + 1}月支出分类统计</span>
                            <span>每月1日0时清空</span>
                        </div>
                        <div className="space-y-2.5 pt-1">
                            {activeCategoryExpenses.length === 0 ? (
                                <div className="text-center py-6 text-gray-400 text-xs">本月暂无支出记录</div>
                            ) : (
                                activeCategoryExpenses.map(([cat, amount]) => {
                                    const percent = Math.max(Math.round((amount / maxExpense) * 100), 5);
                                    return (
                                        <div key={cat} className="flex items-center text-xs space-x-2">
                                            <span className="w-12 text-right text-gray-400 truncate">{cat}</span>
                                            <div className="flex-1 bg-gray-800 rounded-full h-2 overflow-hidden relative">
                                                <div 
                                                    className="h-full rounded-full transition-all duration-300"
                                                    style={{ width: `${percent}%`, backgroundColor: theme }}
                                                ></div>
                                            </div>
                                            <span className="w-16 font-mono text-right text-gray-200 font-num">¥{formatYuan(amount)}</span>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </div>

                    <div className="flex justify-between items-center">
                        <div className="flex items-center space-x-2">
                            <span className="font-bold text-base">{year}年 {month + 1}月</span>
                            <div className="flex space-x-1">
                                <button onClick={() => setCurrentMonth(new Date(year, month - 1, 1))} className="p-1 rounded hover:bg-gray-100"><Icon name="chevronLeft" size={16} /></button>
                                <button onClick={() => setCurrentMonth(new Date(year, month + 1, 1))} className="p-1 rounded hover:bg-gray-100"><Icon name="chevronRight" size={16} /></button>
                            </div>
                        </div>
                        <button 
                            onClick={onOpenAdd}
                            className="px-4 py-2 rounded-xl text-white font-semibold text-sm shadow-md active:scale-95 transition"
                            style={{ backgroundColor: theme }}
                        >
                            + 记一笔
                        </button>
                    </div>

                    <div className="space-y-4">
                        {groupedTxs.length === 0 ? (
                            <div className="text-center py-12 text-gray-400 text-sm">
                                本月还没有账目，点击记一笔开始吧
                            </div>
                        ) : (
                            groupedTxs.map(group => (
                                <div key={group.date} className="bg-gray-50/70 rounded-2xl p-4 border border-gray-100 space-y-2">
                                    <div className="flex justify-between items-center text-xs text-gray-500 font-semibold border-b border-gray-200/60 pb-1.5 font-num">
                                        <span>{group.date}</span>
                                        <div className="space-x-3">
                                            {group.dayExpense > 0 && <span>支: ¥{formatYuan(group.dayExpense)}</span>}
                                            {group.dayIncome > 0 && <span>收: ¥{formatYuan(group.dayIncome)}</span>}
                                        </div>
                                    </div>
                                    <div className="space-y-2">
                                        {group.items.map(tx => (
                                            <div 
                                                key={tx.id} 
                                                onClick={() => onEditTx(tx)}
                                                className="flex justify-between items-center bg-white p-3 rounded-xl shadow-xs cursor-pointer hover:bg-gray-50 transition"
                                            >
                                                <div>
                                                    <div className="text-sm font-semibold">{tx.category}</div>
                                                    {tx.note && <div className="text-xs text-gray-400 truncate max-w-[200px] mt-0.5">{tx.note}</div>}
                                                </div>
                                                <div className={`font-mono font-bold text-sm font-num ${tx.type === 'expense' ? 'text-gray-800' : 'text-emerald-600'}`}>
                                                    {tx.type === 'expense' ? '-' : '+'}¥{formatYuan(tx.amountCents)}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        }

        function TransactionModal({ editingTx, theme, onClose, onSave, onDelete }) {
            const [type, setType] = useState(editingTx ? editingTx.type : 'expense');
            const [amount, setAmount] = useState(editingTx ? (editingTx.amountCents / 100).toString() : '');
            const [category, setCategory] = useState(editingTx ? editingTx.category : PRESET_CATEGORIES.expense[0]);
            const [date, setDate] = useState(editingTx ? editingTx.date : new Date().toISOString().split('T')[0]);
            const [note, setNote] = useState(editingTx ? (editingTx.note || '') : '');

            const handleTypeChange = (newType) => {
                setType(newType);
                setCategory(PRESET_CATEGORIES[newType][0]);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const num = parseFloat(amount);
                if (isNaN(num) || num <= 0) {
                    alert('请输入有效的金额');
                    return;
                }
                if (num > 9999999.99) {
                    alert('单笔金额超出上限');
                    return;
                }
                const amountCents = Math.round(num * 100);
                onSave({ type, amountCents, category, date, note });
            };

            return (
                <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
                    <div className="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl flex flex-col space-y-4 animate-in slide-in-from-bottom duration-200">
                        <div className="flex justify-between items-center">
                            <h3 className="font-bold text-base">{editingTx ? '编辑账目' : '记一笔'}</h3>
                            <button onClick={onClose} className="p-1 rounded-full hover:bg-gray-100"><Icon name="x" size={20} /></button>
                        </div>

                        <div className="flex bg-gray-100 p-1 rounded-xl">
                            <button 
                                type="button" 
                                onClick={() => handleTypeChange('expense')}
                                className={`flex-1 py-2 text-xs font-semibold rounded-lg transition ${type === 'expense' ? 'bg-white shadow-xs text-black' : 'text-gray-500'}`}
                            >
                                支出
                            </button>
                            <button 
                                type="button" 
                                onClick={() => handleTypeChange('income')}
                                className={`flex-1 py-2 text-xs font-semibold rounded-lg transition ${type === 'income' ? 'bg-white shadow-xs text-black' : 'text-gray-500'}`}
                            >
                                收入
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="text-xs text-gray-500 mb-1 block">金额 (¥)</label>
                                <input 
                                    type="number" 
                                    step="0.01" 
                                    value={amount}
                                    onChange={(e) => setAmount(e.target.value)}
                                    placeholder="0.00"
                                    autoFocus
                                    className="w-full text-2xl font-bold font-mono p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-gray-400 font-num"
                                />
                            </div>

                            <div>
                                <label className="text-xs text-gray-500 mb-1 block">分类</label>
                                <div className="grid grid-cols-4 gap-2">
                                    {PRESET_CATEGORIES[type].map(cat => (
                                        <button
                                            key={cat}
                                            type="button"
                                            onClick={() => setCategory(cat)}
                                            className={`py-2 text-xs rounded-xl border transition ${category === cat ? 'border-black font-bold bg-gray-900 text-white' : 'border-gray-200 bg-gray-50 text-gray-700'}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-2">
                                <div>
                                    <label className="text-xs text-gray-500 mb-1 block">日期</label>
                                    <input 
                                        type="date" 
                                        value={date} 
                                        max={new Date().toISOString().split('T')[0]}
                                        onChange={(e) => setDate(e.target.value)}
                                        className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none font-num"
                                    />
                                </div>
                                <div>
                                    <label className="text-xs text-gray-500 mb-1 block">备注 (选填)</label>
                                    <input 
                                        type="text" 
                                        value={note} 
                                        maxLength="100"
                                        onChange={(e) => setNote(e.target.value)}
                                        placeholder="最多100字..."
                                        className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none"
                                    />
                                </div>
                            </div>

                            <div className="flex space-x-2 pt-2">
                                {editingTx && (
                                    <button 
                                        type="button" 
                                        onClick={() => onDelete(editingTx.id)}
                                        className="py-3 px-4 bg-red-50 text-red-600 rounded-xl text-sm font-semibold hover:bg-red-100 transition"
                                    >
                                        删除
                                    </button>
                                )}
                                <button 
                                    type="submit"
                                    className="flex-1 py-3 text-white font-bold rounded-xl text-sm shadow-md active:scale-95 transition"
                                    style={{ backgroundColor: theme }}
                                >
                                    保存
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function CalendarView({ sessions, diaries, theme, currentMonth, setCurrentMonth, onSelectDate }) {
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDayIndex = new Date(year, month, 1).getDay();

            const dailyMap = useMemo(() => {
                const map = {};
                sessions.forEach(s => {
                    map[s.date] = (map[s.date] || 0) + s.durationSeconds;
                });
                return map;
            }, [sessions]);

            const getCustomStyle = (seconds) => {
                if (!seconds) return {};
                if (seconds < 1800) return { backgroundColor: hexToRgba(theme, 0.2), color: '#111' };
                if (seconds < 5400) return { backgroundColor: hexToRgba(theme, 0.5), color: '#111' };
                return { backgroundColor: theme, color: '#fff', fontWeight: 'bold' };
            };

            const calendarCells = [];
            for (let i = 0; i < firstDayIndex; i++) {
                calendarCells.push(<div key={'empty-' + i} className="h-16"></div>);
            }
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const totalSec = dailyMap[dateStr] || 0;
                const hasDiary = !!diaries[dateStr];
                const isToday = dateStr === new Date().toISOString().split('T')[0];

                calendarCells.push(
                    <div 
                        key={dateStr} 
                        onClick={() => onSelectDate(dateStr)}
                        style={getCustomStyle(totalSec)}
                        className={`h-16 rounded-xl p-1 flex flex-col items-center justify-center cursor-pointer transition relative border border-transparent ${totalSec === 0 ? 'bg-gray-50 text-gray-700' : ''}`}
                    >
                        {isToday && (
                            <span className="absolute top-1 right-1 text-amber-400 drop-shadow-sm">
                                <Icon name="star" size={15} />
                            </span>
                        )}
                        <span className="text-sm font-semibold font-num">{d}</span>
                        <div className="h-2 flex items-center justify-center mt-1">
                            {hasDiary && <span className="w-1.5 h-1.5 rounded-full bg-amber-600"></span>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center">
                        <h2 className="font-bold text-lg font-num">{year}年 {month + 1}月</h2>
                        <div className="flex space-x-1">
                            <button onClick={() => setCurrentMonth(new Date(year, month - 1, 1))} className="p-2 rounded-lg hover:bg-gray-100"><Icon name="chevronLeft" size={18} /></button>
                            <button onClick={() => setCurrentMonth(new Date(year, month + 1, 1))} className="p-2 rounded-lg hover:bg-gray-100"><Icon name="chevronRight" size={18} /></button>
                        </div>
                    </div>
                    <div className="grid grid-cols-7 gap-2 text-center text-xs font-medium text-gray-400">
                        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                    </div>
                    <div className="grid grid-cols-7 gap-2">
                        {calendarCells}
                    </div>
                </div>
            );
        }

        function DateDetailModal({ date, sessions, transactions, diary, onClose, onSaveDiary, onGoToTransactions, theme }) {
            const [content, setContent] = useState(diary);

            const totalSec = sessions.reduce((acc, s) => acc + s.durationSeconds, 0);
            const totalHours = (totalSec / 3600).toFixed(1);
            const focusSummaryText = `今日专注${totalHours}小时`;

            const dayExpense = transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amountCents, 0);
            const dayIncome = transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amountCents, 0);
            const formatYuan = (cents) => (cents / 100).toFixed(2);

            useEffect(() => {
                onSaveDiary(content);
            }, [content]);

            return (
                <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl flex flex-col h-[85vh]">
                        <div className="flex justify-between items-center mb-2">
                            <div>
                                <h3 className="font-bold text-base font-num">{date} 详情</h3>
                                <p className="text-xs text-gray-400 mt-0.5 font-num">{focusSummaryText}</p>
                            </div>
                            <button onClick={onClose} className="p-1 rounded-full hover:bg-gray-100"><Icon name="x" size={20} /></button>
                        </div>

                        <div className="bg-gray-50 border border-gray-100 rounded-2xl p-3 my-2 flex justify-between items-center text-xs">
                            <div>
                                <div className="font-semibold text-gray-700">当日账目</div>
                                <div className="text-gray-500 mt-0.5 font-num">
                                    支出: ¥{formatYuan(dayExpense)} | 收入: ¥{formatYuan(dayIncome)} ({transactions.length}笔)
                                </div>
                            </div>
                            <button 
                                onClick={onGoToTransactions}
                                className="px-3 py-1.5 rounded-xl text-white font-medium text-xs shadow-xs"
                                style={{ backgroundColor: theme }}
                            >
                                查看账目
                            </button>
                        </div>

                        <div className="flex-1 flex flex-col mt-2">
                            <label className="text-xs text-gray-500 mb-1">当日日记</label>
                            <textarea 
                                value={content}
                                onChange={(e) => setContent(e.target.value)}
                                placeholder="写下当天的日记..."
                                className="w-full flex-1 bg-gray-50 border border-gray-100 rounded-2xl p-4 text-sm resize-none focus:outline-none focus:ring-1 focus:ring-gray-300 font-num"
                            ></textarea>
                            <div className="text-right text-xs text-gray-400 mt-2">自动保存</div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
